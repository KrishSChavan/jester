<!doctype html>
<!-- His website as an app, with his server out of reach: shown by sw.js instead of the browser's error. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08060c" />
    <title>Jester</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #08060c;
        color: #efe9f7;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        border-radius: 22%;
        box-shadow: 0 0 60px rgb(138 99 216 / 35%);
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 22px;
        color: #a79bbe;
      }
      a {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 999px;
        background: #8a63d8;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/web/icons/apple-touch-icon.png" alt="" width="72" height="72" />
      <h1>Jester can’t be reached</h1>
      <p>His server only answers on your own devices, through Tailscale. Check Tailscale is on here, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
