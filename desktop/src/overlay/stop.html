<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jester stop</title>
    <link rel="stylesheet" href="stop.css" />
  </head>
  <body>
    <button id="stop" type="button" aria-label="Stop automation">
      <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" /></svg>
    </button>
    <div class="ask" role="alertdialog" aria-labelledby="question">
      <span id="question">Stop automation?</span>
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
    <script type="module" src="stop.js"></script>
  </body>
</html>
