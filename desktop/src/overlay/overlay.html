<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jester overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="cursor" class="cursor" hidden>
      <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="20" />
        <circle id="ring" class="ring" cx="24" cy="24" r="20" />
      </svg>
      <span class="dot"></span>
    </div>
    <div id="ripple" class="ripple"></div>
    <div class="dock">
      <div id="hud" class="pill hud" hidden>
        <span id="hud-glyph" class="glyph"></span>
        <span id="hud-label"></span>
        <span class="bar"><span id="hud-fill" class="fill"></span></span>
      </div>
      <div id="toast" class="pill toast" role="status" aria-live="polite" hidden>
        <span id="toast-text"></span>
        <span id="toast-detail" class="detail"></span>
      </div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
