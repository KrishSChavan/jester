<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jester asks</title>
    <link rel="stylesheet" href="approval.css" />
  </head>
  <body>
    <div class="ask" role="alertdialog" aria-labelledby="question" aria-describedby="hint">
      <span class="text">
        <span id="question"></span>
        <span id="hint" class="hint">or 👍, or say yes</span>
      </span>
      <button id="allow" type="button">Allow</button>
      <button id="deny" type="button">Don’t</button>
    </div>
    <script type="module" src="approval.js"></script>
  </body>
</html>
